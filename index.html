<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#151515">
<title>CREATIVE CONTROL</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101010;color:#fff;font-family:Arial,Helvetica,sans-serif}iframe{display:block;width:100%;height:100%;border:0;background:#101010}.status{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:32px;background:radial-gradient(circle at 50% 20%,#303030,#101010 65%);z-index:-1}.status h1{margin:0 0 12px;font-size:clamp(38px,6vw,86px);letter-spacing:-.04em}.status p{margin:6px 0;color:#bbb;max-width:560px}.status b{color:#fff}
</style>
</head>
<body>
<div class="status"><div><h1>CREATIVE CONTROL</h1><p><b>GitHub Edition</b></p><p>Loading the locally hosted game…</p></div></div>
<iframe id="gameFrame" src="game.html" title="CREATIVE CONTROL" allow="autoplay; fullscreen"></iframe>
<script>
const frame=document.getElementById('gameFrame');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    if(!doc||doc.getElementById('ccLivePatch'))return;
    const script=doc.createElement('script');
    script.id='ccLivePatch';
    script.src='cc-runtime-patch.js?v=20260829-3';
    (doc.head||doc.body||doc.documentElement).appendChild(script);
  }catch(err){console.error('CREATIVE CONTROL live patch could not load',err)}
});
</script>
</body>
</html>
