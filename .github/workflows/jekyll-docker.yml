name: Import CREATIVE CONTROL to GitHub

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-game:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, '[github-hosted]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy CREATIVE CONTROL into GitHub
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://jazzy-dolphin-39a282.netlify.app"
          mkdir -p assets

          curl -fSL "$BASE/index.html" -o index.html
          curl -fSL "$BASE/app.js" -o app.js
          curl -fSL "$BASE/universe.js" -o universe.js
          curl -fSL "$BASE/builtin_pics.js" -o builtin_pics.js
          curl -fSL "$BASE/styles.css" -o styles.css
          curl -fSL "$BASE/jszip.min.js" -o jszip.min.js
          curl -fSL "$BASE/data.zip" -o data.zip
          curl -fSL "$BASE/assets/creative-control-cover.webp" -o assets/creative-control-cover.webp
          curl -fSL "$BASE/assets/creative-control-title-theme.mp3" -o assets/creative-control-title-theme.mp3
          touch .nojekyll

      - name: Commit GitHub-hosted game
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.js universe.js builtin_pics.js styles.css jszip.min.js data.zip assets .nojekyll
          if git diff --cached --quiet; then
            echo "Game files are already hosted in GitHub."
          else
            git commit -m "Host CREATIVE CONTROL directly on GitHub [github-hosted]"
            git push
          fi
